[project]
name = "lunar-calendar-ics"
version = "0.1.0"
description = "Public ICS feed generator for Chinese lunar reminders"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "lunardate>=0.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/lunar_calendar"]
